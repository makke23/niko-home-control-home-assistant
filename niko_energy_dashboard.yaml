title: Niko Energy
views:
  - title: Electricity
    path: electricity
    icon: mdi:lightning-bolt
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: grid
            columns: 3
            square: false
            cards:
              - type: sensor
                entity: __NIKO_NET_FROM_GRID_POWER__
                name: From grid
                icon: mdi:transmission-tower-import
              - type: sensor
                entity: __NIKO_NET_TO_GRID_POWER__
                name: To grid
                icon: mdi:transmission-tower-export
              - type: sensor
                entity: __NIKO_MONTHLY_PEAK__
                name: Monthly peak
                icon: mdi:chart-bell-curve-cumulative

          - type: history-graph
            title: Live grid power - last 24 hours
            hours_to_show: 24
            entities:
              - entity: __NIKO_NET_FROM_GRID_POWER__
                name: From grid
              - entity: __NIKO_NET_TO_GRID_POWER__
                name: To grid

          - type: statistics-graph
            title: Monthly peak - last 30 days
            chart_type: line
            days_to_show: 30
            period: day
            entities:
              - entity: __NIKO_MONTHLY_PEAK__
                name: Monthly peak
            stat_types:
              - max
            min_y_axis: 0
            fit_y_data: true

          - type: energy-date-selection
            collection_key: energy_niko

          - type: horizontal-stack
            cards:
              - type: statistic
                entity: __NIKO_GRID_IMPORT_TOTAL__
                name: Consumption in period
                icon: mdi:transmission-tower-import
                unit: kWh
                stat_type: change
                period: energy_date_selection
                collection_key: energy_niko
              - type: statistic
                entity: __NIKO_GRID_EXPORT_TOTAL__
                name: Export in period
                icon: mdi:transmission-tower-export
                unit: kWh
                stat_type: change
                period: energy_date_selection
                collection_key: energy_niko

          - type: statistics-graph
            title: Consumption and export
            chart_type: bar
            entities:
              - entity: __NIKO_GRID_IMPORT_TOTAL__
                name: Consumption
                color: "#6b7280"
              - entity: __NIKO_GRID_EXPORT_TOTAL__
                name: Export
                color: "#22a06b"
            stat_types:
              - change
            energy_date_selection: true
            collection_key: energy_niko
            min_y_axis: 0
            fit_y_data: true
            expand_legend: true

  - title: Smart plugs
    path: smart-plugs
    icon: mdi:power-socket-eu
    panel: true
    cards:
      - type: vertical-stack
        cards:
          # __NIKO_SMART_PLUG_LIVE__

          - type: energy-date-selection
            collection_key: energy_niko_smart_plugs

          # __NIKO_SMART_PLUG_GRAPHS__

          - type: markdown
            content: >-
              The selected period applies to all smart-plug charts. The charts
              use historical data retained by Niko Home Control II. Integration
              and dashboard developed by Maarten Moortgat.

  # __NIKO_OPTIONAL_VIEWS__
